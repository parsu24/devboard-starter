apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: devboard-fe
  namespace: devboard-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devboard-fe
  template:
    metadata:
      labels:
        app: devboard-fe
    spec:
      containers:
      - name: devboard-frontend
        image: trainwithshubham/devboard-frontend:latest
        ports:
        - containerPort: 4173

        resources:
            requests: #Mininmum resource requirements
              cpu: 10m # 0.01 core of cpu
              memory: 64Mi # 67 mb of RAM
          
            limits: #Maximum resource requirement
             cpu: 250m #0.25 cores of cpu
             memory: 128Mi

